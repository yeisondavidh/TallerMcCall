<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>Taller de motos McCall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-lockup auth-brand"><span class="brand-mark">M</span><div><p class="eyebrow">TALLER DE MOTOS</p><h1>McCall</h1></div></div>
      <p class="auth-kicker">CONTROL LOCAL DEL TALLER</p>
      <h2>Tu operación, en orden.</h2>
      <p class="muted">Ingresa con el usuario entregado por el administrador.</p>
      <form id="loginForm" class="login-form">
        <label>Usuario<input name="username" required autocomplete="username" placeholder="Ej. admin"></label>
        <label>Contraseña<input name="password" required type="password" autocomplete="current-password" placeholder="••••••••"></label>
        <button class="primary-button" type="submit">Ingresar al taller</button>
      </form>
      <div class="login-hint"><strong>Acceso inicial</strong><span>admin / McCall2026</span></div>
      <p id="loginError" class="form-error" aria-live="polite"></p>
    </div>
  </div>
  <div id="app" class="app-shell is-hidden">
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-mark">M</span><div><p class="eyebrow">TALLER DE MOTOS</p><h1>McCall</h1></div></div>
      <div class="header-user"><span id="currentUserLabel"></span><button class="icon-button" id="logoutButton" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">↪</button></div>
    </header>
    <main id="mainContent"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Navegación principal"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
